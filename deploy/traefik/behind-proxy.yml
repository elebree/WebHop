# Added to docker-compose.yml by COMPOSE_FILE in .env when another web server (nginx, HAProxy)
# owns ports 80 and 443 and passes the domain's TLS connections through with PROXY protocol.
services:
  traefik:
    # Only the proxied entry point, on loopback, for the web server to forward to
    ports: !override
      - "127.0.0.1:8443:8443"

# A fixed subnet, so the forwarded connections arrive from its gateway, 172.30.0.1, the address the
# proxied entry point trusts. If another network on the host uses it, change it here and the
# trusted address in docker-compose.yml.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
