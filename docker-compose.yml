# The gateway. Set the auth token first, e.g. in a .env file next to this file:
#   WEBHOP_AUTHTOKEN=<long random string>
# then: docker compose up --build   and open http://localhost:8080
services:
  gateway:
    build:
      context: .
      dockerfile: WebHop.Gateway.Host/Dockerfile
    ports:
      - "8080:8080"
    environment:
      WEBHOP_AUTHTOKEN: ${WEBHOP_AUTHTOKEN:?Set WEBHOP_AUTHTOKEN}
      # A reverse proxy in front (nginx, Traefik, Caddy) on this host or a private network is
      # believed about the client's IP and scheme (X-Forwarded-For/-Proto) without anything set
      # here. Only a proxy that connects from a public address needs the line below, which
      # believes every client, so then let nothing but the proxy reach the gateway:
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    restart: unless-stopped
